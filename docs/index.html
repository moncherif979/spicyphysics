<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SpicyPhysics — File Explorer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: monospace; background: #fdf6e3; color: #073642; margin: 2em; }
    h1 { text-align: center; }
    ul { list-style: none; padding-left: 1em; }
    li { margin: 0.3em 0; }
    a { text-decoration: none; color: #268bd2; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>🌶️ SpicyPhysics Repo Browser</h1>
  <p><a href="https://github.com/moncherif979/spicyphysics">Back to GitHub</a></p>
  <div id="file-list">Loading files...</div>

  <script>
    async function fetchContents(path = '') {
      const url = `https://api.github.com/repos/moncherif979/spicyphysics/contents/${path}`;
      const res = await fetch(url);
      return res.json();
    }

    async function render(path = '') {
      const files = await fetchContents(path);
      let html = '<ul>';
      for (const file of files) {
        if (file.type === 'dir') {
          html += `<li>📂 <a href="?path=${file.path}">${file.name}/</a></li>`;
        } else {
          html += `<li>📄 <a href="${file.html_url}" target="_blank">${file.name}</a></li>`;
        }
      }
      html += '</ul>';
      document.getElementById('file-list').innerHTML = html;
    }

    // Handle navigation
    const params = new URLSearchParams(window.location.search);
    const path = params.get('path') || '';
    render(path);
  </script>
</body>
</html>
