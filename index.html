<!DOCTYPE html>
<html lang="en">
<head>

  <title>SpicyPhysics — Notes & PDFs</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2em;
      max-width: 800px;
    }
    h1 {
      text-align: center;
    }
    .pdf-list {
      list-style-type: none;
      padding: 0;
    }
    .pdf-list li {
      margin: 1em 0;
    }
    .pdf-list a {
      font-size: 1.2em;
      text-decoration: none;
      color: #2a5d84;
    }
    .pdf-list a:hover {
      text-decoration: underline;
    }
    .preview {
      margin-top: 0.5em;
      border: 1px solid #ccc;
      height: 300px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>SpicyPhysics — Notes (GitHub Page in Beta)</h1>

    <li>
      <a href="admech.pdf" target="_blank">admech.pdf</a>
      <div class="preview">
        <iframe src="admech.pdf#view=FitH" width="100%" height="100%"></iframe>
      </div>
    </li>
    <li>
      <a href="electromagnetism.pdf" target="_blank">electromagnetism.pdf</a>
      <div class="preview">
        <iframe src="electromagnetism.pdf#view=FitH" width="100%" height="100%"></iframe>

    <li>
